<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Card Builder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #e91e63; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #c2185b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Wedding Cards</h1>
        <form action="/generate" method="post">
            <div class="form-group">
                <label for="bride_name">Bride's Name</label>
                <input type="text" id="bride_name" name="bride_name" required placeholder="e.g. Priya">
            </div>
            <div class="form-group">
                <label for="groom_name">Groom's Name</label>
                <input type="text" id="groom_name" name="groom_name" required placeholder="e.g. Rahul">
            </div>
            <div class="form-group">
                <label for="date">Wedding Date</label>
                <input type="text" id="date" name="date" required placeholder="e.g. 15th December 2026">
            </div>
            <div class="form-group">
                <label for="venue">Venue</label>
                <input type="text" id="venue" name="venue" required placeholder="e.g. Grand Palace, Mumbai">
            </div>
            <button type="submit">Generate Cards</button>
        </form>
    </div>
</body>
</html>
