<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Cards for {{ bride_name }} & {{ groom_name }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        h1 { color: #4a4a4a; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding-bottom: 15px; }
        .card img { width: 100%; height: auto; display: block; border-bottom: 2px solid #eee; margin-bottom: 15px; }
        .card-title { font-weight: bold; font-size: 1.1rem; color: #333; }
        .back-btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .back-btn:hover { background-color: #555; }
        .edit-btn { display: inline-block; margin-top: 10px; padding: 8px 15px; background-color: #8b3dff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem; transition: background 0.3s;}
        .edit-btn:hover { background-color: #6a2bc4; }
        
        /* Modal styling */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; margin-top: 5vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); object-fit: contain; }
        .close { position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close:hover, .close:focus { color: #bbb; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Generated Cards for {{ bride_name }} & {{ groom_name }}</h1>
    
    <div class="grid">
        {% for variant in variants %}
        <div class="card">
            <img src="{{ variant }}" alt="Wedding Card Variant" ondblclick="openModal(this.src)" style="cursor: zoom-in;" title="Double click to enlarge">
            <div class="card-title">Variant {{ loop.index }}</div>
            <a href="/editor?image={{ variant }}" class="edit-btn">Edit in Canva Clone</a>
        </div>
        {% endfor %}
    </div>

    <a href="/" class="back-btn">Create New Cards</a>

    <!-- The Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function openModal(src) {
            document.getElementById('imageModal').style.display = "block";
            document.getElementById('modalImg').src = src;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        // Close on ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
</body>
</html>
